[package]
name = "shr-fx"
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
description = "Standalone wet-only dual-engine send effects rack"
license = "MIT"

[dependencies]
ratatui = "=0.20.1"
crossterm = "=0.26.1"
jack = "=0.13.5"
alsa = "=0.12.1"
rtrb = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
signal-hook = "=0.3.18"
unicode-width = "=0.1.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
